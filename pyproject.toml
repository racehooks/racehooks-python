[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racehooks"
version = "0.6.1"
description = "Official RaceHooks client library — predictive models and analytics for motorsport, delivered to your endpoint. REST client, signed-webhook verification, typed event models, and optional gRPC streaming."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RaceHooks", email = "contact@racehooks.io" }]
keywords = ["racehooks", "motorsport", "racing", "analytics", "predictive-models", "webhook", "hmac", "sse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://racehooks.io"
Repository = "https://github.com/racehooks/racehooks-python"

[project.optional-dependencies]
# gRPC streaming client (heavy, C-extension deps) — opt-in: pip install racehooks[grpc]
grpc = [
    "grpcio>=1.50",
    "protobuf>=4.21",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "flask>=2.0",
    "fastapi>=0.100",
    "httpx>=0.24",
]
# Codegen toolchain for regenerating the protobuf stubs (see scripts/gen_proto.sh).
codegen = [
    "grpcio-tools>=1.50",
    "protoletariat>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["racehooks"]

[tool.semantic_release]
# Single source of truth for the version is [project].version above.
version_toml = ["pyproject.toml:project.version"]
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]\n\nAutomated release."
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Generated protobuf stubs are not linted/formatted.
extend-exclude = ["racehooks/grpc/_gen"]

[tool.ruff.lint]
# Pin the rule set (ruff's default set widened in 0.17 and broke CI on untouched files).
select = ["E4", "E7", "E9", "F"]
