name: Release

# Fully automated release on every push to main. python-semantic-release reads the
# conventional-commit messages since the last release, decides the version bump,
# updates pyproject.toml, commits it back, tags, builds the sdist+wheel, and cuts a
# GitHub release. The built dist is then published to PyPI via Trusted Publishing
# (OIDC) — no API token. Commits with no releasable changes publish nothing.
#
# The PyPI project must trust this repo + publish.yml + the "pypi" environment
# (pypi.org → project → Publishing → Trusted Publisher). Requires id-token: write.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # python-semantic-release: commit version bump + create tag/release
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI (OIDC trusted publishing)
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach built artifacts to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
